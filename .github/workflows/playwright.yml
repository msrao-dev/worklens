name: WorkLens Playwright Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  playwright-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: automation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: automation/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
        env:
          WORKLENS_BASE_URL: ${{ vars.WORKLENS_BASE_URL }}
          WORKLENS_TEST_EMAIL: ${{ secrets.WORKLENS_TEST_EMAIL }}
          WORKLENS_TEST_PASSWORD: ${{ secrets.WORKLENS_TEST_PASSWORD }}
          SMOKE_TEST: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-artifacts
          path: |
            automation/playwright-report/
            automation/test-results/
          retention-days: 7
          if-no-files-found: warn

  evaluation-smoke-tests:
    runs-on: ubuntu-latest

    env:
      SMOKE_TEST: "true"
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install "pip==24.3.1"
          python -m pip install --use-deprecated=legacy-resolver -r requirements.txt

      - name: Debug RAGAS imports
        run: |
          python -m pip show langchain-community langchain-core langchain ragas
          python -c "import importlib.util; print(importlib.util.find_spec('langchain_community.chat_models.vertexai'))"
          python -c "from ragas.embeddings import HuggingFaceEmbeddings; print('RAGAS embeddings import OK')"
      - name: Run text smoke evaluation
        run: python evaluation/score_evaluation.py

      - name: Run image smoke evaluation
        run: python evaluation/run_image_evaluation.py

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-smoke-results
          path: |
            evaluation/ragas_scores_v2.json
            evaluation/image_evaluation_results.json
          retention-days: 7
          if-no-files-found: warn
