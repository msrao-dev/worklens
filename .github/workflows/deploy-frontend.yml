
name: Deploy WorkLens Frontend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

permissions:
  contents: read
  id-token: write

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and deploy frontend
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: ./frontend
          acrName: ${{ vars.ACR_NAME }}
          containerAppName: worklens-frontend-app
          resourceGroup: worklens-frontend
          imageToBuild: ${{ vars.ACR_NAME }}.azurecr.io/worklens-frontend:${{ github.sha }}
