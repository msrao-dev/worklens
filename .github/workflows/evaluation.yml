name: WorkLens Evaluation

# smoke  = a few fast cases on every PR
# sanity = every golden case, on merge to main, nightly, or on demand
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "30 20 * * *" # 02:00 IST
  workflow_dispatch:
    inputs:
      suite:
        description: Which suite to run
        type: choice
        options: [smoke, sanity]
        default: smoke

concurrency:
  group: evaluation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  response-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SUITE: ${{ github.event_name == 'pull_request' && 'smoke' || inputs.suite || 'sanity' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LLM_PROVIDER: groq
      GROQ_MODEL: qwen/qwen3.8-27b
      # Optional repo variable to score with a different Groq model than the app answers with.
      EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL }}
      EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
      UPLOAD_DIR: ./backend/uploads
      CHROMA_PATH: ./backend/chroma_db

    steps:
      # Fork PRs get no secrets, so skip instead of failing.
      - name: Check Groq key
        if: env.GROQ_API_KEY == ''
        run: echo "::notice::GROQ_API_KEY is not available (fork PR?). Skipping the evaluation."

      - name: Checkout repository
        if: env.GROQ_API_KEY != ''
        uses: actions/checkout@v4

      - name: Set up Python
        if: env.GROQ_API_KEY != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache Hugging Face models
        if: env.GROQ_API_KEY != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5

      - name: Install dependencies
        if: env.GROQ_API_KEY != ''
        run: |
          python -m pip install "pip==24.3.1"
          python -m pip install --use-deprecated=legacy-resolver -r requirements.txt
          # RAGAS 0.4.3 needs this langchain-community build; installed without deps on purpose.
          python -m pip install --no-deps "langchain-community==0.4.1"

      - name: Run ${{ env.SUITE }} suite
        if: env.GROQ_API_KEY != ''
        run: python -m evaluation.run_suite --suite "$SUITE"

      - name: Upload evaluation report
        if: always() && env.GROQ_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-${{ env.SUITE }}-report
          path: evaluation/reports/
          retention-days: 14
          if-no-files-found: warn
