name: WorkLens Evaluation

# Manual only: Actions → WorkLens Evaluation → Run workflow, then pick the branch and suite.
# smoke  = a few fast cases
# sanity = every golden case
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Which suite to run
        type: choice
        options: [smoke, sanity]
        default: smoke

concurrency:
  group: evaluation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  response-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SUITE: ${{ inputs.suite }}
      # Separate Groq account, so evaluation never spends the live app's quota.
      EVAL_GROQ_API_KEY: ${{ secrets.EVAL_GROQ_API_KEY }}
      LLM_PROVIDER: groq
      GROQ_MODEL: qwen/qwen3.8-27b
      # Optional repo variable to score with a different Groq model than the app answers with.
      EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL }}
      EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
      UPLOAD_DIR: ./backend/uploads
      CHROMA_PATH: ./backend/chroma_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5

      - name: Install dependencies
        run: |
          python -m pip install "pip==24.3.1"
          python -m pip install --use-deprecated=legacy-resolver -r requirements.txt
          # RAGAS 0.4.3 needs this langchain-community build; installed without deps on purpose.
          python -m pip install --no-deps "langchain-community==0.4.1"

      - name: Run ${{ inputs.suite }} suite
        run: python -m evaluation.run_suite --suite "$SUITE"

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-${{ inputs.suite }}-report
          path: evaluation/reports/
          retention-days: 14
          if-no-files-found: warn
